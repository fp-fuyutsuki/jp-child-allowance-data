[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-child-allowance-data"
dynamic = ["version"]
description = "Machine-readable Japanese child allowance data in CSV, JSON, and Python API formats."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
authors = [
  {name = "jp-child-allowance-data maintainers"}
]
keywords = ["japan", "child allowance", "open data", "csv", "json", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "twine",
]

[project.urls]
Homepage = "https://github.com/fp-fuyutsuki/jp-child-allowance-data"
Repository = "https://github.com/fp-fuyutsuki/jp-child-allowance-data"
Issues = "https://github.com/fp-fuyutsuki/jp-child-allowance-data/issues"
Changelog = "https://github.com/fp-fuyutsuki/jp-child-allowance-data/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "jp_child_allowance_data._version.__version__"}

[tool.setuptools.package-data]
jp_child_allowance_data = [
  "data/csv/*.csv",
  "data/json/*.json",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jp_child_allowance_data*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
